org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
kotlin.code.style=official
tvflick.versionName=0.1.0
# Public GitHub repository used to check for updates.
tvflick.releaseRepository=Gghz007/TV-Flick
# Optional signed rules channel. Public HTTPS URL + Base64 X.509 RSA public key.
tvflick.adblockUpdateUrl=
tvflick.adblockPublicKey=
# Public RSA key for signed Windows executable module packages. Empty disables the installer.
tvflick.desktopModulePublicKey=
# Independent build-time module versions. Runtime rules use their own revision numbers.
tvflick.plugins.plugin-api.version=0.1.0
tvflick.plugins.plugin-engine.version=0.1.0
tvflick.plugins.source-plugin.version=0.1.0
tvflick.plugins.video-plugin.version=0.5.1
tvflick.plugins.adblock-plugin.version=0.2.0
